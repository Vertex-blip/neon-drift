name: Package native Windows preview

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-release.yml"
      - "godot/**"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot-linux.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 3 -o godot-windows.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          unzip -q godot-linux.zip
          unzip -q godot-windows.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import source assets
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Check driving and interface
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/smoke.gd
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ui_regression.gd
      - name: Package playable Windows build
        run: |
          mkdir -p dist
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-pack 'Windows Desktop' "${{ github.workspace }}/dist/NeonDrift.pck"
          cp Godot_v4.7.2-stable_win64.exe dist/NeonDrift.exe
          cp godot/CREDITS.md dist/CREDITS.md
          cd dist
          zip -q -9 NeonDrift-Windows.zip NeonDrift.exe NeonDrift.pck CREDITS.md
      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1-native-fixes || gh release create v0.2.1-native-fixes --target "${{ github.sha }}" --prerelease --title "Neon Drift 0.2.1 — Driving and UI Fixes" --notes-file godot/docs/RELEASE-0.2.1.md
          gh release upload v0.2.1-native-fixes dist/NeonDrift-Windows.zip --clobber
